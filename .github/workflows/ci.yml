name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce registry-only dependency sources
        run: node scripts/check-dependency-sources.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install reviewed workspace graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Enforce package boundaries
        run: pnpm check:package-boundaries
      - name: Format and lint gate
        run: pnpm check:style
      - name: Build workspace packages and compatibility distribution
        run: pnpm build
      - name: Package tarball smoke test
        run: pnpm check:pack
      - name: Release artifact coherence
        run: pnpm check:release
      - name: OpenCode SDK supply-chain contract
        run: pnpm test:opencode-contract
      - name: Typecheck compatibility distribution
        run: pnpm typecheck:root
      - name: Unit and recovery tests
        run: pnpm test:raw
      - name: Host contract tests
        run: pnpm test:host-contracts:raw

  release-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce registry-only dependency sources
        run: node scripts/check-dependency-sources.mjs
      - name: Require reviewed pnpm lockfile
        run: test -f pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
