name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce registry-only dependency sources
        run: node scripts/check-dependency-sources.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies for code validation
        # Build/test lifecycle scripts run explicitly below. Keeping install script-free
        # makes dependency-resolution failures distinguishable from source failures.
        run: pnpm install --frozen-lockfile=false --ignore-scripts
      - name: OpenCode SDK supply-chain contract
        run: node --import tsx --test tests/contracts/opencode-client.test.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and recovery tests
        run: pnpm test
      - name: Host contract tests
        run: pnpm test:host-contracts
      - name: Build
        run: pnpm build

  release-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce registry-only dependency sources
        run: node scripts/check-dependency-sources.mjs
      - name: Require reviewed pnpm lockfile
        run: test -f pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
