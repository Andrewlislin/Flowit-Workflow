          doctor_replacement = """export function claudeCodeDoctorChecks(
  options: SetupRequestOptions,
  state: ClaudeCodeState,
): DoctorCheck[] {
  const checks: DoctorCheck[] = [
    state.claudeExecutable
      ? {
          id: 'claude-executable',
          status: 'ok',
          summary: `Claude Code executable detected at ${state.claudeExecutable}`,
        }
      : {
          id: 'claude-executable',
          status: 'warning',
          summary: 'Claude Code executable was not found on PATH',
          repairable: false,
        },
  ]

  const missing = state.files.filter(file => !file.current.exists)
  const modified = state.files.filter(file =>
    file.current.exists && Boolean(file.ownedHash) && file.current.hash !== file.ownedHash,
  )
  const unowned = state.files.filter(file => file.current.exists && !file.ownedHash)
  if (state.conflicts.length || missing.length || modified.length || unowned.length) {
    checks.push({
      id: 'claude-ownership-integrity',
      status: 'error',
      summary: 'Claude Flowit plugin ownership integrity is not intact',
      detail: [
        ...state.conflicts,
        ...(missing.length ? [`Missing: ${missing.map(row => row.relativePath).join(', ')}`] : []),
        ...(modified.length ? [`Modified after setup: ${modified.map(row => row.relativePath).join(', ')}`] : []),
        ...(unowned.length ? [`Present but unowned: ${unowned.map(row => row.relativePath).join(', ')}`] : []),
      ].join(' '),
      repairable: missing.length > 0 && modified.length === 0 && unowned.length === 0,
    })
  } else {
    checks.push({
      id: 'claude-ownership-integrity',
      status: 'ok',
      summary: 'Claude Flowit plugin files match their installation ownership snapshot',
    })
  }

  for (const file of state.files) {
    const intact = file.current.exists && Boolean(file.ownedHash) && file.current.hash === file.ownedHash
    checks.push(intact
      ? {
          id: `plugin-integrity:${file.relativePath}`,
          status: 'ok',
          summary: `${file.relativePath} matches the installed ownership snapshot`,
        }
      : {
          id: `plugin-integrity:${file.relativePath}`,
          status: 'error',
          summary: file.current.exists
            ? `${file.relativePath} no longer matches its installed ownership snapshot`
            : `${file.relativePath} is missing from the installed Claude plugin`,
          repairable: !file.current.exists && Boolean(file.ownedHash),
        })
  }

  checks.push(claudeRuntimeMatchesManifest(state)
    ? {
        id: 'claude-runtime-currency',
        status: 'ok',
        summary: `Installed Claude plugin is bound to Flowit ${state.runtime.packageVersion} at ${state.runtime.packageRoot}`,
      }
    : {
        id: 'claude-runtime-currency',
        status: 'warning',
        summary: state.manifest?.version === 1
          ? 'Claude setup manifest predates Runtime provenance; run confirmed setup to migrate it'
          : 'Claude plugin files are intact but refer to a different Flowit Runtime than the Doctor currently running',
        detail: state.manifest?.version === 2
          ? `Installed Runtime: ${state.manifest.runtime.packageVersion} at ${state.manifest.runtime.packageRoot}. Current Doctor Runtime: ${state.runtime.packageVersion} at ${state.runtime.packageRoot}.`
          : undefined,
        repairable: false,
      })

  const activation = state.activation
  const current = claudeActivationIsCurrent(state)
  checks.push(activation
    ? {
        id: 'claude-plugin-registration',
        status: 'ok',
        summary: `Claude has emitted Flowit activation evidence for ${activation.pluginRoot}`,
      }
    : {
        id: 'claude-plugin-registration',
        status: 'warning',
        summary: 'No Claude activation evidence exists for this Flowit plugin root',
        repairable: false,
      })
  checks.push(current && (activation?.mcpInitializedAt || activation?.lifecycleHookSeenAt || activation?.userPromptHookSeenAt)
    ? {
        id: 'claude-plugin-enabled',
        status: 'ok',
        summary: 'The current Flowit plugin generation has been loaded by Claude',
      }
    : {
        id: 'claude-plugin-enabled',
        status: 'warning',
        summary: 'The current Flowit plugin generation has not been observed in a Claude session',
        repairable: false,
      })
  checks.push(current && activation?.mcpInitializedAt
    ? {
        id: 'claude-mcp-activation',
        status: 'ok',
        summary: `Claude initialized the Flowit MCP server at ${activation.mcpInitializedAt}`,
      }
    : {
        id: 'claude-mcp-activation',
        status: 'warning',
        summary: 'The current Claude session has not initialized this Flowit MCP generation',
        repairable: false,
      })
  checks.push(current && activation?.userPromptHookSeenAt
    ? {
        id: 'claude-routing-hook-activation',
        status: 'ok',
        summary: `Claude ran the Flowit UserPromptSubmit routing Hook at ${activation.userPromptHookSeenAt}`,
      }
    : {
        id: 'claude-routing-hook-activation',
        status: 'warning',
        summary: 'The current Flowit UserPromptSubmit routing Hook has not been observed',
        repairable: false,
      })
  checks.push(current && activation?.preToolHookSeenAt
    ? {
        id: 'claude-pretool-hook-activation',
        status: 'ok',
        summary: `Claude ran the Flowit PreToolUse caller-attestation Hook at ${activation.preToolHookSeenAt}`,
      }
    : current && activation?.userPromptHookSeenAt
      ? {
          id: 'claude-pretool-hook-activation',
          status: 'skipped',
          summary: 'PreToolUse attestation has not been exercised yet; it will be recorded on the first adaptive Flowit tool call',
          repairable: false,
        }
      : {
          id: 'claude-pretool-hook-activation',
          status: 'warning',
          summary: 'No current-generation Flowit routing Hook evidence is available',
          repairable: false,
        })
  checks.push(current
    ? {
        id: 'claude-reload-required',
        status: 'ok',
        summary: 'Claude activation evidence matches the currently installed Flowit generation',
      }
    : {
        id: 'claude-reload-required',
        status: 'warning',
        summary: 'Restart Claude Code or run `/reload-plugins` to activate the currently installed Flowit generation',
        repairable: false,
      })

  checks.push(state.stateRootExists
    ? {
        id: 'claude-state-root',
        status: 'ok',
        summary: 'Claude durable state directory exists',
      }
    : {
        id: 'claude-state-root',
        status: 'warning',
        summary: 'Claude durable state directory has not been initialized',
        repairable: true,
      })
  if (options.scope === 'project') {
    checks.push({
      id: 'claude-project-trust',
      status: 'warning',
      summary: 'Project-scope Flowit plugins remain subject to Claude Code workspace trust and MCP approval',
      repairable: false,
    })
  }
  return checks
}

export function claudeRuntimeMatchesManifest(state: ClaudeCodeState): boolean {
  if (state.manifest?.version !== 2) return false
  const installed = state.manifest.runtime
  const current = state.runtime
  return installed.packageName === current.packageName &&
    installed.packageVersion === current.packageVersion &&
    path.resolve(installed.packageRoot) === path.resolve(current.packageRoot) &&
    installed.nodeExecutable === current.nodeExecutable &&
    installed.mcpServerPath === current.mcpServerPath &&
    installed.mcpServerDigest === current.mcpServerDigest &&
    installed.cliPath === current.cliPath &&
    installed.cliDigest === current.cliDigest &&
    installed.generation === current.generation
}

export function claudeActivationIsCurrent(state: ClaudeCodeState): boolean {
  const activation = state.activation
  return Boolean(
    activation &&
    activation.generation === state.generation &&
    path.resolve(activation.pluginRoot) === path.resolve(state.paths.pluginRoot) &&
    (!activation.runtimePackageRoot ||
      path.resolve(activation.runtimePackageRoot) === path.resolve(state.runtime.packageRoot)) &&
    (!activation.packageVersion || activation.packageVersion === state.runtime.packageVersion) &&
    (!activation.mcpServerDigest || activation.mcpServerDigest === state.runtime.mcpServerDigest) &&
    (!activation.cliDigest || activation.cliDigest === state.runtime.cliDigest),
  )
}

export function claudeInstallationIsIntact(state: ClaudeCodeState): boolean {
  return state.conflicts.length === 0 && state.files.every(file =>
    file.current.exists && Boolean(file.ownedHash) && file.current.hash === file.ownedHash,
  )
}

export function desiredOwnedFilesAfterPlan"""
          text, count = doctor_pattern.subn(doctor_replacement, text, count=1)
