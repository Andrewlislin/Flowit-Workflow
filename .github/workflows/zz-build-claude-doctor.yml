  }
  if (!claudeActivationIsCurrent(state)) {
    steps.push('Restart Claude Code or run `/reload-plugins` so the current Flowit plugin generation, MCP server, and routing Hooks are loaded.')
  }
  return steps
}

export function claudeCodeDoctorChecks"""
          text, count = manual_pattern.subn(manual_replacement, text, count=1)
