              raise SystemExit('doctor function replacement failed')

          desired_pattern = re.compile(
              r"async function desiredClaudePluginFiles\(.*?\n\}\n\nasync function readClaudeSetupManifest",
              re.S,
          )
          desired_replacement = """async function desiredClaudeRuntimeProvenance(
  paths: ClaudeCodeSetupPaths,
): Promise<ClaudeCodeRuntimeProvenance> {
  const [packageRaw, mcpServer, cli] = await Promise.all([
    readFile(paths.packageManifestFile, 'utf8'),
    readFile(paths.mcpServerFile, 'utf8'),
    readFile(paths.cliFile, 'utf8'),
  ])
  const packageManifest = parseJsonObject(packageRaw, paths.packageManifestFile)
  const packageName = typeof packageManifest.name === 'string'
    ? packageManifest.name.trim()
    : ''
  const packageVersion = typeof packageManifest.version === 'string'
    ? packageManifest.version.trim()
    : ''
  if (!packageName || !packageVersion) {
    throw new Error('Flowit package name/version is missing')
  }
  const packageRoot = path.dirname(paths.packageManifestFile)
  const base = {
    packageName,
    packageVersion,
    packageRoot,
    nodeExecutable: process.execPath,
    mcpServerPath: paths.mcpServerFile,
    mcpServerDigest: digest(mcpServer),
    cliPath: paths.cliFile,
    cliDigest: digest(cli),
  }
  return {
    ...base,
    generation: digest(JSON.stringify({ ...base, pluginRoot: paths.pluginRoot })),
  }
}

async function desiredClaudePluginFiles(
  paths: ClaudeCodeSetupPaths,
  runtime: ClaudeCodeRuntimeProvenance,
): Promise<Record<ClaudeCodeManagedFile, string>> {
  const [pluginRaw, runBound, orchestrate, route] = await Promise.all([
    readFile(paths.sourcePluginManifestFile, 'utf8'),
    readFile(paths.sourceRunBoundSkillFile, 'utf8'),
    readFile(paths.sourceOrchestrateSkillFile, 'utf8'),
    readFile(paths.sourceRouteSkillFile, 'utf8'),
  ])
  const sourcePlugin = parseJsonObject(pluginRaw, paths.sourcePluginManifestFile)
  const pluginManifest = {
    ...sourcePlugin,
    name: CLAUDE_CODE_PLUGIN_NAME,
    version: runtime.packageVersion,
  }
  const routingAuthorityDir = path.join(paths.stateRoot, 'routing-authority')
  const activationArgs = [
    `--flowit-plugin-root=${paths.pluginRoot}`,
    `--flowit-generation=${runtime.generation}`,
    `--flowit-runtime-root=${runtime.packageRoot}`,
    `--flowit-runtime-version=${runtime.packageVersion}`,
    `--flowit-mcp-digest=${runtime.mcpServerDigest}`,
    `--flowit-cli-digest=${runtime.cliDigest}`,
    `--flowit-activation-file=${paths.activationFile}`,
  ]
  const mcp = {
    mcpServers: {
      orchestration: {
        command: runtime.nodeExecutable,
        args: [runtime.mcpServerPath],
        env: {
          FLOWIT_WORKFLOW_ADAPTER: 'claude-code',
          FLOWIT_WORKFLOW_PLUGIN_ROOT: paths.pluginRoot,
          FLOWIT_WORKFLOW_CLAUDE_MUTATIONS: '1',
          FLOWIT_WORKFLOW_CLAUDE_ALLOW_LIVE_RESUME: '0',
          FLOWIT_WORKFLOW_ROUTING_MODE: 'suggest',
          FLOWIT_WORKFLOW_ROUTING_AUTHORITY_DIR: routingAuthorityDir,
          FLOWIT_WORKFLOW_ROUTING_REQUIRE_CALLER_ATTESTATION: '1',
          FLOWIT_WORKFLOW_INSTALLATION_GENERATION: runtime.generation,
          FLOWIT_WORKFLOW_RUNTIME_PACKAGE_ROOT: runtime.packageRoot,
          FLOWIT_WORKFLOW_RUNTIME_VERSION: runtime.packageVersion,
          FLOWIT_WORKFLOW_MCP_SERVER_DIGEST: runtime.mcpServerDigest,
          FLOWIT_WORKFLOW_CLI_DIGEST: runtime.cliDigest,
          FLOWIT_WORKFLOW_CLAUDE_ACTIVATION_FILE: paths.activationFile,
        },
      },
    },
  }
  const hookEntry = {
    hooks: [{
      type: 'command',
      command: runtime.nodeExecutable,
      args: [runtime.cliPath, 'claude-hook', ...activationArgs],
      timeout: 10,
    }],
  }
  const routingHookEntry = {
    hooks: [{
      type: 'command',
      command: runtime.nodeExecutable,
      args: [runtime.cliPath, 'claude-routing-hook', ...activationArgs],
      timeout: 10,
    }],
  }
  const hooks = {
    hooks: {
      UserPromptSubmit: [routingHookEntry],
      PreToolUse: [{
        matcher:
          '^mcp__plugin_flowit-workflow_orchestration__(workflow_assess|workflow_prepare|workflow_commit)$',
        ...routingHookEntry,
      }],
      SessionStart: [hookEntry],
      Stop: [hookEntry],
      StopFailure: [hookEntry],
      TaskCompleted: [hookEntry],
      SubagentStop: [hookEntry],
      SessionEnd: [hookEntry],
    },
  }
  return {
    '.claude-plugin/plugin.json': `${JSON.stringify(pluginManifest, null, 2)}\n`,
    'skills/run-bound/SKILL.md': runBound,
    'skills/orchestrate/SKILL.md': orchestrate,
    'skills/route/SKILL.md': route,
    'hooks/hooks.json': `${JSON.stringify(hooks, null, 2)}\n`,
    '.mcp.json': `${JSON.stringify(mcp, null, 2)}\n`,
  }
}

async function readClaudeSetupManifest"""
