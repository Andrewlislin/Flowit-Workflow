          parser_replacement = """async function readClaudeSetupManifest(
  file: string,
): Promise<ClaudeCodeSetupManifest | undefined> {
  try {
    const value = parseJsonObject(await readFile(file, 'utf8'), file)
    const common =
      value.hostId === CLAUDE_CODE_SETUP_HOST_ID &&
      (value.scope === 'user' || value.scope === 'project') &&
      typeof value.projectDir === 'string' &&
      typeof value.pluginRoot === 'string' &&
      isRecord(value.ownedFiles) &&
      Object.values(value.ownedFiles).every(hash => typeof hash === 'string') &&
      typeof value.installedAt === 'string'
    if (!common) throw new Error(`invalid Claude Code setup ownership manifest ${file}`)
    if (value.version === 1) return value as unknown as ClaudeCodeSetupManifestV1
    if (value.version !== CLAUDE_CODE_SETUP_MANIFEST_VERSION || !isRecord(value.runtime)) {
      throw new Error(`invalid Claude Code setup ownership manifest ${file}`)
    }
    const runtime = value.runtime
    if (
      typeof runtime.packageName !== 'string' ||
      typeof runtime.packageVersion !== 'string' ||
      typeof runtime.packageRoot !== 'string' ||
      typeof runtime.nodeExecutable !== 'string' ||
      typeof runtime.mcpServerPath !== 'string' ||
      typeof runtime.mcpServerDigest !== 'string' ||
      typeof runtime.cliPath !== 'string' ||
      typeof runtime.cliDigest !== 'string' ||
      typeof runtime.generation !== 'string'
    ) throw new Error(`invalid Claude Code Runtime provenance in ${file}`)
    return value as unknown as ClaudeCodeSetupManifestV2
  } catch (error: unknown) {
    if ((error as NodeJS.ErrnoException).code === 'ENOENT') return undefined
    throw error
  }
}

