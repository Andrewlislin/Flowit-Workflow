name: one-shot build Claude provenance doctor

on:
  push:
    branches:
      - fix/claude-doctor-provenance-activation

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claude-doctor-provenance-activation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Implement provenance and activation-aware Doctor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          state_path = Path('src/setup/providers/claude-code-state.ts')
          text = state_path.read_text()
          text = text.replace(
              "import type { DoctorCheck, HostSetupContext, SetupRequestOptions } from '../types.js'\n",
              "import {\n  readClaudeActivation,\n  type ClaudeActivationRecord,\n} from '../../claude-activation.js'\nimport type { DoctorCheck, HostSetupContext, SetupRequestOptions } from '../types.js'\n",
          )
          text = text.replace(
              'export const CLAUDE_CODE_SETUP_MANIFEST_VERSION = 1',
              'export const CLAUDE_CODE_SETUP_MANIFEST_VERSION = 2',
          )
          manifest_pattern = re.compile(
              r"export interface ClaudeCodeSetupManifest \{.*?\n\}\n\nexport interface ClaudeCodeManagedFileState",
              re.S,
          )
          manifest_replacement = """export interface ClaudeCodeRuntimeProvenance {
  readonly packageName: string
  readonly packageVersion: string
  readonly packageRoot: string
  readonly nodeExecutable: string
  readonly mcpServerPath: string
  readonly mcpServerDigest: string
  readonly cliPath: string
  readonly cliDigest: string
  readonly generation: string
}

export interface ClaudeCodeSetupManifestV1 {
  readonly version: 1
  readonly hostId: 'claude-code'
  readonly scope: 'user' | 'project'
  readonly projectDir: string
  readonly pluginRoot: string
  readonly ownedFiles: Readonly<Record<string, string>>
  readonly installedAt: string
}

export interface ClaudeCodeSetupManifestV2 {
  readonly version: 2
  readonly hostId: 'claude-code'
  readonly scope: 'user' | 'project'
  readonly projectDir: string
  readonly pluginRoot: string
  readonly ownedFiles: Readonly<Record<string, string>>
  readonly installedAt: string
  readonly runtime: ClaudeCodeRuntimeProvenance
}

export type ClaudeCodeSetupManifest =
  | ClaudeCodeSetupManifestV1
  | ClaudeCodeSetupManifestV2

