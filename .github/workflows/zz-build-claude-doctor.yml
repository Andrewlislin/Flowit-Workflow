              raise SystemExit('manifest interface replacement failed')
          text = text.replace(
              '  readonly cliFile: string\n}',
              '  readonly cliFile: string\n  readonly activationFile: string\n}',
          )
          text = text.replace(
              "  readonly claudeExecutable?: string\n  readonly conflicts: readonly string[]\n}",
              "  readonly claudeExecutable?: string\n  readonly runtime: ClaudeCodeRuntimeProvenance\n  readonly generation: string\n  readonly activation?: ClaudeActivationRecord\n  readonly conflicts: readonly string[]\n}",
          )
          old_inspect = """  const [manifest, desired, pluginRootExists, stateRootExists, claudeExecutable] = await Promise.all([
    readClaudeSetupManifest(paths.setupManifestFile),
    desiredClaudePluginFiles(paths),
    pathExists(paths.pluginRoot),
    pathExists(paths.stateRoot),
    findClaudeExecutable(context),
  ])"""
          new_inspect = """  const runtime = await desiredClaudeRuntimeProvenance(paths)
  const [
    manifest,
    desired,
    pluginRootExists,
    stateRootExists,
    claudeExecutable,
