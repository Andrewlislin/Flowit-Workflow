          text = text.replace(old_inspect, new_inspect)
          text = text.replace(
              "    ...(claudeExecutable ? { claudeExecutable } : {}),\n    conflicts: [],",
              "    ...(claudeExecutable ? { claudeExecutable } : {}),\n    runtime,\n    generation: runtime.generation,\n    ...(activation ? { activation } : {}),\n    conflicts: [],",
          )

          paths_pattern = re.compile(
              r"export function claudeCodeSetupPaths\(.*?\n\}\n\nexport function claudeCodeManualSteps",
              re.S,
          )
          paths_replacement = """export function claudeCodeSetupPaths(
  context: HostSetupContext,
  options: SetupRequestOptions,
): ClaudeCodeSetupPaths {
  const projectDir = path.resolve(options.projectDir)
  const skillsRoot = options.scope === 'user'
    ? path.join(context.homeDir, '.claude', 'skills')
    : path.join(projectDir, '.claude', 'skills')
  const stateRoot = path.join(context.homeDir, '.flowit-workflow', 'claude')
  return {
    pluginRoot: path.join(skillsRoot, CLAUDE_CODE_PLUGIN_NAME),
    setupManifestFile: options.scope === 'user'
      ? path.join(context.homeDir, '.flowit-workflow', 'setup', 'claude-code-user.json')
