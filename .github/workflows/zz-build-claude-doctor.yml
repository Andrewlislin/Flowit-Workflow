test('Doctor separates intact ownership from Runtime provenance drift', async () => {
  const root = await mkdtemp(path.join(os.tmpdir(), 'flowit-claude-doctor-drift-'))
  const home = path.join(root, 'home')
  const project = path.join(root, 'project')
  const bin = path.join(root, 'bin')
  await Promise.all([mkdir(home), mkdir(project), mkdir(bin)])
  await writeFile(path.join(bin, 'claude'), '#!/bin/sh\\n')
  const installedRoot = await packageFixture(root, 'runtime-installed')
  const currentRoot = path.join(root, 'runtime-current')
  await cp(installedRoot, currentRoot, { recursive: true })
  await writeFile(path.join(currentRoot, 'dist', 'cli.js'), 'export const current = true\\n')
  const options: SetupRequestOptions = { scope: 'user', projectDir: project }
  const context = (packageRoot: string): HostSetupContext => ({
    cwd: project,
    homeDir: home,
    packageRoot,
    platform: process.platform,
    arch: process.arch,
    nodeVersion: '24.0.0',
    env: { PATH: bin },
  })
  const provider = new ClaudeCodeSetupProvider()
  try {
    const plan = await provider.planSetup(context(installedRoot), options)
    await provider.applySetup(context(installedRoot), plan, { ...options, assumeYes: true })

    const report = await provider.doctor(context(currentRoot), options)
    assert.equal(report.status, 'degraded')
    assert.equal(report.checks.find(check => check.id === 'claude-ownership-integrity')?.status, 'ok')
    assert.equal(report.checks.find(check => check.id === 'claude-runtime-currency')?.status, 'warning')
    assert.equal(report.checks.some(check => /missing or differs/i.test(check.summary)), false)

    const repair = await provider.planRepair(context(currentRoot), report, options)
    assert.deepEqual(repair.actions, [])
    assert.match(repair.warnings.join('\\n'), /will not silently switch|canonical Runtime/i)

    const manifest = JSON.parse(await readFile(path.join(home, '.flowit-workflow', 'setup', 'claude-code-user.json'), 'utf8'))
    assert.equal(manifest.version, 2)
    assert.equal(manifest.runtime.packageRoot, installedRoot)
  } finally {
    await rm(root, { recursive: true, force: true })
  }
})
""")
