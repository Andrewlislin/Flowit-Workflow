name: apply WorkBuddy polling safety fix

on:
  push:
    branches:
      - fix/workbuddy-model-polling-safety

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply the reviewed WorkBuddy safety changes
        run: python3 .github/scripts/apply-workbuddy-polling-fix.py

      - name: Validate the full repository gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check

      - name: Commit the validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/zz-workbuddy-polling-safety.yml \
            .github/scripts/apply-workbuddy-polling-fix.py
          git add \
            src/setup/providers/workbuddy-state.ts \
            integrations/workbuddy/flowit-bridge-worker/SKILL.md \
            docs/workbuddy-desktop-bridge.md \
            tests/workbuddy-polling-safety.test.ts
          git commit -m 'fix(workbuddy): stop model-powered empty polling'
          git push origin HEAD:fix/workbuddy-model-polling-safety
