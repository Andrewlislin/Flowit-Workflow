name: inventory beta4 release references

on:
  push:
    branches:
      - release/v0.5.0-beta.4-prep

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.0-beta.4-prep
          fetch-depth: 0
      - name: Inventory current-version references
        run: |
          echo '=== tracked references to 0.5.0-beta.3 ==='
          git grep -n -I '0.5.0-beta.3' || true
          echo '=== package manifests ==='
          find . -name package.json -not -path './node_modules/*' -print | sort
