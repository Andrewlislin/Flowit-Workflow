name: Review hardening bootstrap

on:
  push:
    branches:
      - fix/review-durability-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply review hardening patch
        run: python3 scripts/apply-review-hardening.py
      - name: Fix generated lock descriptor typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/core/src/internal/file-lock.ts')
          s = p.read_text()
          old = """    return {\n      kind: 'directory',\n      ...(await readOwner(lockDir).then(owner => (owner ? { owner } : {}))),\n      ageMs: Date.now() - info.mtimeMs,\n    }\n"""
          new = """    const owner = await readOwner(lockDir)\n    return owner\n      ? { kind: 'directory', owner, ageMs: Date.now() - info.mtimeMs }\n      : { kind: 'directory', ageMs: Date.now() - info.mtimeMs }\n"""
          if old not in s:
              raise SystemExit('descriptor snippet not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install reviewed dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Normalize modified TypeScript
        run: |
          pnpm exec biome format --write \
            packages/core/src/internal/file-lock.ts \
            packages/core/src/core/store.ts \
            packages/core/src/core/types.ts \
            packages/core/src/core/runtime.ts \
            packages/core/src/core/adapter.ts \
            packages/core/src/bridge/state.ts \
            packages/core/src/bridge/receipt.ts \
            packages/adapter-claude-code/src/claude/state.ts \
            packages/adapter-claude-code/src/adapters/claude-code.ts \
            packages/adapter-file-bridge/src/index.ts \
            packages/adapter-codex/src/index.ts \
            src/daemon-lease.ts src/runtime-factory.ts \
            tests/file-lock-race.test.ts tests/cursor-isolation.test.ts \
            tests/daemon-lease.test.ts tests/durable-claims.test.ts \
            tests/adapter-readiness.test.ts tests/contracts/codex-app-server.test.ts \
            tests/bridge-cancellation.test.ts
      - name: Validate hardening
        run: |
          pnpm check:supply-chain
          pnpm check:package-boundaries
          pnpm build
          pnpm check:pack
          pnpm test:opencode-contract
          pnpm typecheck:root
          pnpm test:raw
          pnpm test:host-contracts:raw
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/review-hardening-bootstrap.yml scripts/apply-review-hardening.py
          git commit -m 'fix: harden durability and adapter lifecycle invariants'
          git push origin "HEAD:${GITHUB_REF_NAME}"
