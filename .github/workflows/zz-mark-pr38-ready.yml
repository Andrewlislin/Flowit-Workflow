name: mark PR38 ready

on:
  push:
    branches:
      - feat/codex-approved-permission-envelopes

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codex-approved-permission-envelopes
          fetch-depth: 0
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 38 --repo Andrewlislin/Flowit-Workflow
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/zz-mark-pr38-ready.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary PR ready workflow'
          git push origin HEAD:feat/codex-approved-permission-envelopes
