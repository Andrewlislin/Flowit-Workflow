name: mark PR38 ready for review

on:
  push:
    branches:
      - feat/codex-approved-permission-envelopes

permissions:
  pull-requests: write

jobs:
  ready:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Mark the original pull request ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 38 --repo "${{ github.repository }}"
