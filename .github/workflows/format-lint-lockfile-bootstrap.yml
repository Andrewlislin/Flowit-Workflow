name: Bootstrap format lint lockfile

on:
  push:
    branches:
      - chore/format-lint-guard

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'Andrewlislin/Flowit-Workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: update pnpm lockfile for Biome'
          git push origin "HEAD:${GITHUB_REF_NAME}"
