name: strengthen PR38 CWD verification

on:
  push:
    branches:
      - feat/codex-approved-permission-envelopes

permissions:
  contents: write

jobs:
  strengthen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codex-approved-permission-envelopes
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exhaustive CWD verification
        run: |
          python .github/scripts/strengthen-pr38-cwd.py
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/adapter-codex/src/public.ts')
          text = path.read_text()
          old = """    throw contextualizeProtocolError(
      new AggregateError(errors, `no Codex executable could read Session ${sessionId}`),
      `Codex Session ${sessionId} is unavailable`,
    )
"""
          new = """    const permissionFailure = errors.find(error =>
      error instanceof AgentExecutionError && error.code === 'PERMISSION_UNAVAILABLE',
    )
    if (permissionFailure) throw permissionFailure
    throw contextualizeProtocolError(
      new AggregateError(errors, `no Codex executable could read Session ${sessionId}`),
      `Codex Session ${sessionId} is unavailable`,
    )
"""
          if text.count(old) != 1:
              raise SystemExit('permission failure classification block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Validate full repository contract
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check
      - name: Commit validated CWD verification
        run: |
          rm .github/scripts/strengthen-pr38-cwd.py
          rm .github/workflows/zz-strengthen-pr38-cwd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(codex): verify every permission-bound thread read cwd'
          git push origin HEAD:feat/codex-approved-permission-envelopes
