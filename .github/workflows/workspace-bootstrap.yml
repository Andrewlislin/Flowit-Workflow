name: Bootstrap package boundaries

on:
  push:
    branches:
      - refactor/package-boundaries

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Split core and adapters into workspace packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/core/src packages/adapter-claude-code/src packages/adapter-opencode/src packages/adapter-codex/src packages/adapter-dsh/src packages/adapter-file-bridge/src packages/adapter-workbuddy/src packages/adapter-doubao-office/src

          git mv src/core packages/core/src/core
          git mv src/bridge packages/core/src/bridge

          mkdir -p packages/adapter-claude-code/src/adapters
          git mv src/adapters/claude-code.ts packages/adapter-claude-code/src/adapters/claude-code.ts
          git mv src/claude packages/adapter-claude-code/src/claude

          git mv src/adapters/opencode.ts packages/adapter-opencode/src/index.ts
          git mv src/adapters/codex.ts packages/adapter-codex/src/index.ts

          mkdir -p packages/adapter-dsh/src/adapters
          git mv src/adapters/dsh.ts packages/adapter-dsh/src/adapters/dsh.ts
          git mv src/dsh packages/adapter-dsh/src/dsh

          git mv src/adapters/file-bridge.ts packages/adapter-file-bridge/src/index.ts
          git mv src/adapters/workbuddy.ts packages/adapter-workbuddy/src/index.ts
          git mv src/adapters/doubao-office.ts packages/adapter-doubao-office/src/index.ts

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # Package implementations now depend on public workspace boundaries, not root-relative internals.
          for path in list(Path('packages').rglob('*.ts')):
              text = path.read_text()
              replacements = {
                  "from '../core/types.js'": "from '@coaseedge/flowit-core'",
                  "from '../core/runtime.js'": "from '@coaseedge/flowit-core'",
                  "from '../core/domain.js'": "from '@coaseedge/flowit-core'",
                  "from '../core/store.js'": "from '@coaseedge/flowit-core'",
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if path.as_posix() == 'packages/adapter-file-bridge/src/index.ts':
                  text = text.replace("from '../bridge/receipt.js'", "from '@coaseedge/flowit-core/bridge/receipt'")
                  text = text.replace("from '../bridge/state.js'", "from '@coaseedge/flowit-core/bridge/state'")
                  text = text.replace("from '../bridge/execution-lease.js'", "from '@coaseedge/flowit-core/bridge/execution-lease'")
              if path.as_posix() == 'packages/adapter-workbuddy/src/index.ts':
                  text = text.replace("from './file-bridge.js'", "from '@coaseedge/flowit-adapter-file-bridge'")
              if path.as_posix() == 'packages/adapter-doubao-office/src/index.ts':
                  text = text.replace("from './file-bridge.js'", "from '@coaseedge/flowit-adapter-file-bridge'")
              path.write_text(text)

          # Public entry points for packages that contain multiple source areas.
          Path('packages/adapter-claude-code/src/index.ts').write_text(
              "export * from './adapters/claude-code.js'\nexport * from './claude/index.js'\n"
          )
          Path('packages/adapter-dsh/src/index.ts').write_text(
              "export * from './adapters/dsh.js'\nexport * from './dsh/plugin.js'\nexport * from './dsh/tools.js'\n"
          )

          base_ts = {
              'compilerOptions': {
                  'target': 'ES2023', 'module': 'NodeNext', 'moduleResolution': 'NodeNext',
                  'strict': True, 'declaration': True, 'skipLibCheck': True,
                  'verbatimModuleSyntax': True, 'noUncheckedIndexedAccess': True,
                  'exactOptionalPropertyTypes': True, 'types': ['node']
              }
          }
          Path('tsconfig.base.json').write_text(json.dumps(base_ts, indent=2) + '\n')

          def tsconfig():
              return {
                  'extends': '../../tsconfig.base.json',
                  'compilerOptions': {'rootDir': 'src', 'outDir': 'dist'},
                  'include': ['src/**/*.ts'], 'exclude': ['dist', 'node_modules']
              }

          version = '0.4.0'
          engine = {'node': '^22.19.0 || >=24.0.0'}
          repo = {'type': 'git', 'url': 'git+https://github.com/Andrewlislin/Flowit-Workflow.git'}

          packages = {
              'core': {
                  'name': '@coaseedge/flowit-core',
                  'description': 'Host-agnostic durable orchestration core for Flowit Workflow.',
                  'main': 'dist/core/index.js', 'types': 'dist/core/index.d.ts',
                  'exports': {
                      '.': {'types': './dist/core/index.d.ts', 'default': './dist/core/index.js'},
                      './core': {'types': './dist/core/index.d.ts', 'default': './dist/core/index.js'},
                      './core/*': {'types': './dist/core/*.d.ts', 'default': './dist/core/*.js'},
                      './bridge/*': {'types': './dist/bridge/*.d.ts', 'default': './dist/bridge/*.js'}
                  },
              },
              'adapter-claude-code': {
                  'name': '@coaseedge/flowit-adapter-claude-code',
                  'description': 'Claude Code adapter for Flowit Workflow.',
                  'main': 'dist/index.js', 'types': 'dist/index.d.ts',
                  'exports': {
                      '.': {'types': './dist/index.d.ts', 'default': './dist/index.js'},
                      './hook': {'types': './dist/claude/hook.d.ts', 'default': './dist/claude/hook.js'},
                      './runtime': {'types': './dist/claude/runtime.d.ts', 'default': './dist/claude/runtime.js'},
                      './state': {'types': './dist/claude/state.d.ts', 'default': './dist/claude/state.js'},
                      './claude': {'types': './dist/claude/index.d.ts', 'default': './dist/claude/index.js'}
                  },
                  'dependencies': {'@coaseedge/flowit-core': 'workspace:*'},
              },
              'adapter-opencode': {
                  'name': '@coaseedge/flowit-adapter-opencode',
                  'description': 'OpenCode V2 adapter for Flowit Workflow.',
                  'main': 'dist/index.js', 'types': 'dist/index.d.ts',
                  'exports': {'.': {'types': './dist/index.d.ts', 'default': './dist/index.js'}},
                  'dependencies': {'@coaseedge/flowit-core': 'workspace:*', '@opencode-ai/sdk': '1.18.23'},
              },
              'adapter-codex': {
                  'name': '@coaseedge/flowit-adapter-codex',
                  'description': 'Codex App Server adapter for Flowit Workflow.',
                  'main': 'dist/index.js', 'types': 'dist/index.d.ts',
                  'exports': {'.': {'types': './dist/index.d.ts', 'default': './dist/index.js'}},
                  'dependencies': {'@coaseedge/flowit-core': 'workspace:*'},
              },
              'adapter-dsh': {
                  'name': '@coaseedge/flowit-adapter-dsh',
                  'description': 'DeepSeek Harness reference adapter and plugin for Flowit Workflow.',
                  'main': 'dist/index.js', 'types': 'dist/index.d.ts',
                  'exports': {
                      '.': {'types': './dist/index.d.ts', 'default': './dist/index.js'},
                      './plugin': {'types': './dist/dsh/plugin.d.ts', 'default': './dist/dsh/plugin.js'},
                      './tools': {'types': './dist/dsh/tools.d.ts', 'default': './dist/dsh/tools.js'}
                  },
                  'dependencies': {'@coaseedge/flowit-core': 'workspace:*'},
                  'peerDependencies': {
                      '@deepseek-ai/cordis': '^4.0.1', '@deepseek-ai/dsh-agent': '^0.1.1-rc.2',
                      '@deepseek-ai/dsh-llm': '^0.1.1-rc.2', '@deepseek-ai/dsh-session': '^0.1.1-rc.2',
                      '@deepseek-ai/dsh-session-persistence': '^0.1.1-rc.2', '@deepseek-ai/dsh-session-reference': '^0.1.1-rc.2',
                      '@deepseek-ai/dsh-skill': '^0.1.1-rc.2', '@deepseek-ai/dsh-tools': '^0.1.1-rc.2',
                      '@deepseek-ai/schemastery': '^3.18.1'
                  },
              },
              'adapter-file-bridge': {
                  'name': '@coaseedge/flowit-adapter-file-bridge',
                  'description': 'Generic file-bridge adapter for Flowit Workflow.',
                  'main': 'dist/index.js', 'types': 'dist/index.d.ts',
                  'exports': {'.': {'types': './dist/index.d.ts', 'default': './dist/index.js'}},
                  'dependencies': {'@coaseedge/flowit-core': 'workspace:*'},
              },
              'adapter-workbuddy': {
                  'name': '@coaseedge/flowit-adapter-workbuddy',
                  'description': 'WorkBuddy adapter for Flowit Workflow.',
                  'main': 'dist/index.js', 'types': 'dist/index.d.ts',
                  'exports': {'.': {'types': './dist/index.d.ts', 'default': './dist/index.js'}},
                  'dependencies': {'@coaseedge/flowit-core': 'workspace:*', '@coaseedge/flowit-adapter-file-bridge': 'workspace:*'},
              },
              'adapter-doubao-office': {
                  'name': '@coaseedge/flowit-adapter-doubao-office',
                  'description': 'Doubao Office bridge adapter for Flowit Workflow.',
                  'main': 'dist/index.js', 'types': 'dist/index.d.ts',
                  'exports': {'.': {'types': './dist/index.d.ts', 'default': './dist/index.js'}},
                  'dependencies': {'@coaseedge/flowit-core': 'workspace:*', '@coaseedge/flowit-adapter-file-bridge': 'workspace:*'},
              },
          }

          for dirname, extra in packages.items():
              pkg = {
                  'name': extra.pop('name'), 'version': version, 'description': extra.pop('description'),
                  'license': 'Apache-2.0', 'type': 'module', **extra,
                  'files': ['dist'], 'engines': engine,
                  'scripts': {'build': 'tsc -p tsconfig.json', 'typecheck': 'tsc -p tsconfig.json --noEmit'},
                  'repository': repo,
              }
              p = Path('packages') / dirname
              (p / 'package.json').write_text(json.dumps(pkg, indent=2) + '\n')
              (p / 'tsconfig.json').write_text(json.dumps(tsconfig(), indent=2) + '\n')

          # Compatibility wrappers keep existing @coaseedge/flowit-workflow subpath API stable.
          core_files = [p.stem for p in Path('packages/core/src/core').glob('*.ts')]
          Path('src/core').mkdir(parents=True, exist_ok=True)
          for name in core_files:
              target = '@coaseedge/flowit-core' if name == 'index' else f'@coaseedge/flowit-core/core/{name}'
              Path(f'src/core/{name}.ts').write_text(f"export * from '{target}'\n")
          Path('src/bridge').mkdir(parents=True, exist_ok=True)
          for p in Path('packages/core/src/bridge').glob('*.ts'):
              Path(f'src/bridge/{p.stem}.ts').write_text(f"export * from '@coaseedge/flowit-core/bridge/{p.stem}'\n")

          Path('src/adapters').mkdir(parents=True, exist_ok=True)
          adapter_wrappers = {
              'claude-code': '@coaseedge/flowit-adapter-claude-code',
              'opencode': '@coaseedge/flowit-adapter-opencode',
              'codex': '@coaseedge/flowit-adapter-codex',
              'dsh': '@coaseedge/flowit-adapter-dsh',
              'file-bridge': '@coaseedge/flowit-adapter-file-bridge',
              'workbuddy': '@coaseedge/flowit-adapter-workbuddy',
              'doubao-office': '@coaseedge/flowit-adapter-doubao-office',
          }
          for name, target in adapter_wrappers.items():
              Path(f'src/adapters/{name}.ts').write_text(f"export * from '{target}'\n")

          Path('src/claude').mkdir(parents=True, exist_ok=True)
          Path('src/claude/index.ts').write_text("export * from '@coaseedge/flowit-adapter-claude-code/claude'\n")
          for name in ['hook', 'runtime', 'state']:
              Path(f'src/claude/{name}.ts').write_text(f"export * from '@coaseedge/flowit-adapter-claude-code/{name}'\n")
          Path('src/dsh').mkdir(parents=True, exist_ok=True)
          Path('src/dsh/plugin.ts').write_text("export * from '@coaseedge/flowit-adapter-dsh/plugin'\n")
          Path('src/dsh/tools.ts').write_text("export * from '@coaseedge/flowit-adapter-dsh/tools'\n")

          # Root stays the backwards-compatible full/convenience distribution.
          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          deepseek = {
              '@deepseek-ai/cordis': '^4.0.1', '@deepseek-ai/dsh-agent': '^0.1.1-rc.2',
              '@deepseek-ai/dsh-llm': '^0.1.1-rc.2', '@deepseek-ai/dsh-session': '^0.1.1-rc.2',
              '@deepseek-ai/dsh-session-persistence': '^0.1.1-rc.2', '@deepseek-ai/dsh-session-reference': '^0.1.1-rc.2',
              '@deepseek-ai/dsh-skill': '^0.1.1-rc.2', '@deepseek-ai/dsh-tools': '^0.1.1-rc.2',
              '@deepseek-ai/schemastery': '^3.18.1'
          }
          pkg['dependencies'] = {
              '@coaseedge/flowit-core': 'workspace:*',
              '@coaseedge/flowit-adapter-claude-code': 'workspace:*',
              '@coaseedge/flowit-adapter-opencode': 'workspace:*',
              '@coaseedge/flowit-adapter-codex': 'workspace:*',
              '@coaseedge/flowit-adapter-dsh': 'workspace:*',
              '@coaseedge/flowit-adapter-file-bridge': 'workspace:*',
              '@coaseedge/flowit-adapter-workbuddy': 'workspace:*',
              '@coaseedge/flowit-adapter-doubao-office': 'workspace:*',
              **deepseek,
          }
          pkg.pop('peerDependencies', None)
          pkg.pop('peerDependenciesMeta', None)
          pkg['devDependencies'] = {
              '@biomejs/biome': '2.5.10', '@types/node': '^22.20.0', 'tsx': '^4.22.4', 'typescript': '^6.0.3'
          }
          pkg['scripts'].update({
              'build:packages': "pnpm --filter './packages/**' -r build",
              'build': 'pnpm run build:packages && tsc -p tsconfig.json',
              'typecheck': 'pnpm run build:packages && tsc -p tsconfig.json --noEmit',
              'test:raw': 'node --import tsx --test tests/*.test.ts',
              'test:host-contracts:raw': 'node --import tsx --test tests/contracts/*.test.ts',
              'test': 'pnpm run build && pnpm run test:raw',
              'test:host-contracts': 'pnpm run build && pnpm run test:host-contracts:raw',
              'format': 'biome format --write packages/adapter-dsh/src/dsh/tools.ts',
              'format:check': 'biome format packages/adapter-dsh/src/dsh/tools.ts',
              'lint': 'biome lint packages/adapter-dsh/src/dsh/tools.ts',
              'check:style': 'biome ci --reporter=github packages/adapter-dsh/src/dsh/tools.ts',
              'check:package-boundaries': 'node scripts/check-package-boundaries.mjs',
              'check': 'npm run check:supply-chain && npm run check:package-boundaries && npm run check:style && npm run typecheck && npm run test:raw && npm run test:host-contracts:raw',
          })
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          root_ts = json.loads(Path('tsconfig.json').read_text())
          root_ts = {
              'extends': './tsconfig.base.json',
              'compilerOptions': {'rootDir': 'src', 'outDir': 'dist'},
              'include': ['src/**/*.ts'], 'exclude': ['dist', 'node_modules', 'tests', 'packages']
          }
          Path('tsconfig.json').write_text(json.dumps(root_ts, indent=2) + '\n')
          Path('pnpm-workspace.yaml').write_text("packages:\n  - 'packages/*'\n")
          PY

          cat > scripts/check-package-boundaries.mjs <<'EOF'
          import { readFile, readdir } from 'node:fs/promises'
          import path from 'node:path'

          const root = JSON.parse(await readFile('package.json', 'utf8'))
          const dirs = await readdir('packages')
          const manifests = new Map()
          for (const dir of dirs) {
            const manifest = JSON.parse(await readFile(path.join('packages', dir, 'package.json'), 'utf8'))
            manifests.set(manifest.name, manifest)
          }

          const core = manifests.get('@coaseedge/flowit-core')
          if (!core) throw new Error('missing @coaseedge/flowit-core')
          if (Object.keys(core.dependencies ?? {}).length || Object.keys(core.peerDependencies ?? {}).length) {
            throw new Error('@coaseedge/flowit-core must stay free of third-party runtime dependencies')
          }

          const openCode = manifests.get('@coaseedge/flowit-adapter-opencode')
          if (openCode?.dependencies?.['@opencode-ai/sdk'] !== '1.18.23') throw new Error('OpenCode adapter must pin @opencode-ai/sdk@1.18.23')
          const dsh = manifests.get('@coaseedge/flowit-adapter-dsh')
          if (!dsh || Object.keys(dsh.peerDependencies ?? {}).some(name => !name.startsWith('@deepseek-ai/'))) throw new Error('DSH host SDKs must stay peer dependencies of the DSH adapter')

          for (const name of manifests.keys()) {
            if (!name.startsWith('@coaseedge/flowit-')) throw new Error(`unexpected workspace package ${name}`)
          }
          for (const required of manifests.keys()) {
            if (required === '@coaseedge/flowit-core') continue
            if (!root.dependencies?.[required]) throw new Error(`full package does not aggregate ${required}`)
          }
          console.log(`Package boundary policy passed for ${manifests.size} workspace packages.`)
          EOF

          cat > scripts/check-dependency-sources.mjs <<'EOF'
          import { readFile, readdir } from 'node:fs/promises'
          import path from 'node:path'

          const manifests = [['package.json', JSON.parse(await readFile('package.json', 'utf8'))]]
          for (const dir of await readdir('packages')) {
            const filename = path.join('packages', dir, 'package.json')
            manifests.push([filename, JSON.parse(await readFile(filename, 'utf8'))])
          }
          const sections = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']
          const forbidden = /^(?:https?:|git(?:\+[^:]+)?:|github:|gitlab:|bitbucket:|file:|link:)/i
          const violations = []
          for (const [filename, pkg] of manifests) {
            for (const section of sections) {
              for (const [name, specifier] of Object.entries(pkg[section] ?? {})) {
                if (typeof specifier !== 'string') continue
                if (forbidden.test(specifier) || /\.tgz(?:$|[?#])/i.test(specifier)) violations.push(`${filename}: ${section}.${name} = ${specifier}`)
              }
            }
          }
          if (violations.length) {
            console.error('Flowit release manifests only accept registry/version or workspace dependency specifiers.')
            for (const violation of violations) console.error(`- ${violation}`)
            process.exit(1)
          }
          console.log(`Dependency source policy passed across ${manifests.length} manifests.`)
          EOF

          # Document the installation boundary in the architecture docs and README.
          cat >> docs/architecture.md <<'EOF'

          ## Package boundaries

          Flowit's `AgentAdapter` boundary is also an npm package boundary. `@coaseedge/flowit-core` contains the host-agnostic orchestration engine and has no third-party runtime dependencies. Host integrations ship separately as `@coaseedge/flowit-adapter-*` packages. The existing `@coaseedge/flowit-workflow` package remains the full/convenience distribution and re-exports the previous public subpaths for compatibility.

          Minimal consumers install only Core plus the adapters they use; the full package intentionally aggregates every built-in adapter and its host requirements.
          EOF

          cat >> docs/host-adapters.md <<'EOF'

          ## Installation packages

          Host integrations are independently installable packages:

          - `@coaseedge/flowit-core` — host-agnostic Core, no third-party runtime dependencies.
          - `@coaseedge/flowit-adapter-claude-code` — Claude Code integration.
          - `@coaseedge/flowit-adapter-opencode` — OpenCode integration; owns the pinned official `@opencode-ai/sdk` dependency.
          - `@coaseedge/flowit-adapter-codex` — Codex App Server integration.
          - `@coaseedge/flowit-adapter-dsh` — DeepSeek Harness integration; DSH SDKs remain host-owned peer dependencies.
          - `@coaseedge/flowit-adapter-file-bridge`, `-workbuddy`, `-doubao-office` — bridge integrations.
          - `@coaseedge/flowit-workflow` — full/convenience package that aggregates all built-ins and preserves the legacy API surface.
          EOF

          cat >> README.md <<'EOF'

          ## Minimal package installs

          Flowit is a workspace of independently installable orchestration and adapter packages. Install only what the deployment uses:

          ```bash
          # Core only
          pnpm add @coaseedge/flowit-core

          # Core + OpenCode
          pnpm add @coaseedge/flowit-core @coaseedge/flowit-adapter-opencode

          # Core + Claude Code
          pnpm add @coaseedge/flowit-core @coaseedge/flowit-adapter-claude-code

          # Batteries-included / backwards-compatible distribution
          pnpm add @coaseedge/flowit-workflow
          ```

          The full package intentionally has the broadest SBOM. Minimal installations do not inherit unrelated Host SDKs.
          EOF

          pnpm install --lockfile-only --ignore-scripts
          pnpm run check:supply-chain
          pnpm run check:package-boundaries
          pnpm run build
          pnpm run check:style
          pnpm run typecheck
          pnpm run test:raw
          pnpm run test:host-contracts:raw

      - name: Commit workspace migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: split core and host adapters into packages'
          git push origin "HEAD:${GITHUB_REF_NAME}"
