name: Bootstrap package boundaries

on:
  push:
    branches:
      - refactor/package-boundaries

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply package boundary migration
        run: python3 scripts/bootstrap-package-boundaries.py
      - name: Resolve reviewed workspace dependency graph
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Normalize migrated source
        run: pnpm exec biome check --write packages/adapter-dsh/src/dsh/tools.ts
      - name: Validate migrated workspace
        run: |
          pnpm run check:supply-chain
          pnpm run check:package-boundaries
          pnpm run check:style
          pnpm run build
          pnpm run check:pack
          pnpm run typecheck:root
          pnpm run test:raw
          pnpm run test:host-contracts:raw
      - name: Commit workspace migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: split core and host adapters into packages'
          git push origin "HEAD:${GITHUB_REF_NAME}"
