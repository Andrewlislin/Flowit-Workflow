name: sync WorkBuddy polling safety docs

on:
  push:
    branches:
      - fix/workbuddy-model-polling-safety

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Synchronize public WorkBuddy guidance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(file: str, old: str, new: str) -> None:
              path = Path(file)
              value = path.read_text(encoding='utf-8')
              if value.count(old) != 1:
                  raise SystemExit(f'{file}: expected exactly one reviewed source fragment')
              path.write_text(value.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'README.md',
              '| **WorkBuddy** | MCP + Hooks + Bridge / Managed Driver | 日报、网页研究、办公自动化、GUI 操作 | Desktop Bridge 需要 WorkBuddy 原生 Automation 周期调用 Worker |',
              '| **WorkBuddy** | MCP + Hooks + Bridge / Managed Driver | 日报、网页研究、办公自动化、GUI 操作 | [Desktop Bridge](docs/workbuddy-desktop-bridge.md) 只支持有真实请求时按需调用；无人值守需要事件驱动 Managed Driver，禁止模型定时空轮询 |',
          )
          replace_exact(
              'README.en.md',
              '| **WorkBuddy** | MCP + Hooks + Bridge / Managed Driver | Daily briefs, web research, office automation, GUI work | Desktop Bridge needs a WorkBuddy Automation to invoke the Worker periodically |',
              '| **WorkBuddy** | MCP + Hooks + Bridge / Managed Driver | Daily briefs, web research, office automation, GUI work | [Desktop Bridge](docs/workbuddy-desktop-bridge.md) is on-demand only; unattended use requires an event-driven Managed Driver, not model-powered polling |',
          )

          setup_path = Path('docs/setup.md')
          setup = setup_path.read_text(encoding='utf-8')
          old_setup = '''### Desktop Bridge limitation

          Flowit can install every local file needed by the WorkBuddy Desktop Bridge, but WorkBuddy currently exposes no public API for a third-party installer to create or modify a native WorkBuddy Automation. Therefore desktop setup returns an explicit manual step for unattended execution: enable one WorkBuddy Automation that periodically invokes the installed **Flowit Workflow Bridge Worker** Skill.

          If `FLOWIT_WORKFLOW_WORKBUDDY_DRIVER` is configured, the managed-agent-driver path does not require the desktop polling Automation.
          '''
          new_setup = '''### Desktop Bridge execution boundary

          Flowit can install every local file needed by the WorkBuddy Desktop Bridge, but it does not treat a recurring WorkBuddy Automation as a safe queue worker. A native Automation creates a model task before the Bridge Worker can inspect the inbox, so periodic polling creates visible WorkBuddy sessions and consumes model quota even when the inbox is empty.

          Without `FLOWIT_WORKFLOW_WORKBUDDY_DRIVER`, Desktop Bridge execution is therefore **on-demand only**: invoke the installed **Flowit Workflow Bridge Worker** Skill once after a real Flowit request has been queued. Do not attach the Worker to a recurring Automation. For unattended execution, configure a trusted event-driven Managed Driver that starts WorkBuddy only when actual work exists. See [WorkBuddy Desktop Bridge execution safety](workbuddy-desktop-bridge.md).

          Setup reports this as `manual-action-required`; installed MCP, Skill, Hooks, and Bridge directories do not by themselves prove unattended execution readiness.
          '''
          old_setup = old_setup.replace('\n          ', '\n').strip() + '\n'
          new_setup = new_setup.replace('\n          ', '\n').strip() + '\n'
          if setup.count(old_setup) != 1:
              raise SystemExit('docs/setup.md: reviewed Desktop Bridge section was not found exactly once')
          setup_path.write_text(setup.replace(old_setup, new_setup, 1), encoding='utf-8')

          state_path = Path('src/setup/providers/workbuddy-state.ts')
          state = state_path.read_text(encoding='utf-8')
          start = state.index('\nconst modelPollingRequired = requiresDesktopAutomation(context)\n') + 1
          end = state.index('\n\n  return checks', start)
          block = state[start:end]
          if block.splitlines()[0] != 'const modelPollingRequired = requiresDesktopAutomation(context)':
              raise SystemExit('unexpected WorkBuddy doctor indentation source')
          indented = '\n'.join(('  ' + line if line else line) for line in block.splitlines())
          state_path.write_text(state[:start] + indented + state[end:], encoding='utf-8')

          test_path = Path('tests/workbuddy-polling-safety.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = "test('public WorkBuddy guidance rejects recurring model polling'"
          if marker not in test:
              test += '''

          test('public WorkBuddy guidance rejects recurring model polling', async () => {
            const [readme, readmeEn, setup] = await Promise.all([
              readFile(path.join(process.cwd(), 'README.md'), 'utf8'),
              readFile(path.join(process.cwd(), 'README.en.md'), 'utf8'),
              readFile(path.join(process.cwd(), 'docs', 'setup.md'), 'utf8'),
            ])
            for (const document of [readme, readmeEn, setup]) {
              assert.doesNotMatch(
                document,
                /enable one WorkBuddy native Automation that periodically invokes/i,
              )
            }
            assert.match(readme, /禁止模型定时空轮询/)
            assert.match(readmeEn, /not model-powered polling/)
            assert.match(setup, /Desktop Bridge execution is therefore \*\*on-demand only\*\*/)
            assert.match(setup, /workbuddy-desktop-bridge\.md/)
          })
          '''.replace('\n          ', '\n')
              test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate the full repository gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check

      - name: Commit validated documentation sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-workbuddy-doc-sync.yml
          git add \
            README.md \
            README.en.md \
            docs/setup.md \
            src/setup/providers/workbuddy-state.ts \
            tests/workbuddy-polling-safety.test.ts
          git commit -m 'docs(workbuddy): remove recurring polling guidance'
          git push origin HEAD:fix/workbuddy-model-polling-safety
