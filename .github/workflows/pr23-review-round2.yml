name: PR23 Review Round 2

on:
  push:
    branches:
      - pr23-review-round2-staging

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply reviewed fixes
        shell: bash
        run: |
          base64 --decode .github/pr23-round2/fix.py.gz.b64 \
            | gzip --decompress > /tmp/pr23-round2-fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/pr23-round2-fix.py')
          text = path.read_text()
          old = """replace_once(service, '    assertPreflightReady(adapterId, preflight)', '    assertExecutionPreflightReady(adapterId, execution, preflight)')
          replace_once(service, '    assertPreflightReady(adapterId, preflight)', '    assertExecutionPreflightReady(adapterId, execution, preflight)')
          """
          new = """service_text = read(service)
          old_preflight_assert = '    assertPreflightReady(adapterId, preflight)'
          if service_text.count(old_preflight_assert) != 2:
              raise SystemExit(
                  f'{service}: expected two preflight assertions, found {service_text.count(old_preflight_assert)}'
              )
          write(
              service,
              service_text.replace(
                  old_preflight_assert,
                  '    assertExecutionPreflightReady(adapterId, execution, preflight)',
              ),
          )
          """
          if old not in text:
              raise SystemExit('round-two patch script hotfix pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python /tmp/pr23-round2-fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/adapter-codex/src/index.ts')
          text = path.read_text()
          old_models = "    const models = rows.flatMap((row: any) => {\n"
          if text.count(old_models) != 1:
              raise SystemExit(f'expected one untyped catalog model list, found {text.count(old_models)}')
          text = text.replace(
              old_models,
              "    const models: CatalogModel[] = rows.flatMap((row: any) => {\n",
              1,
          )
          old_efforts = """    supportedReasoningEfforts: [...new Set(rawEfforts.flatMap((item: any) => {
                if (typeof item === 'string' && item.trim()) return [item.trim()]
                const effort = firstString(
                  item?.reasoningEffort,
                  item?.reasoning_effort,
                  item?.effort,
                  item?.value,
                )
                return effort ? [effort] : []
              }))],
          """
          new_efforts = """    supportedReasoningEfforts: [...new Set<string>(rawEfforts.flatMap(
                (item: any): string[] => {
                  if (typeof item === 'string' && item.trim()) return [item.trim()]
                  const effort = firstString(
                    item?.reasoningEffort,
                    item?.reasoning_effort,
                    item?.effort,
                    item?.value,
                  )
                  return effort ? [effort] : []
                },
              ))],
          """
          if text.count(old_efforts) != 1:
              raise SystemExit(f'expected one untyped effort list, found {text.count(old_efforts)}')
          path.write_text(text.replace(old_efforts, new_efforts, 1))
          PY
          rm -rf .github/pr23-round2 .github/workflows/pr23-review-round2.yml
          git diff --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run repository gate
        run: pnpm check
      - name: Publish checked candidate commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'fix: enforce execution contracts across Core and Codex runtimes' \
            | git commit-tree "$tree" -p 61893e6950cd6287fb339f1d218554d90c95a0b8)
          git push --force origin "$commit":refs/heads/pr23-review-round2-candidate
          echo "candidate=$commit" >> "$GITHUB_STEP_SUMMARY"
