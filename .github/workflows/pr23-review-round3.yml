name: PR23 Review Round 3

on:
  push:
    branches:
      - pr23-review-round3-staging

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply reviewed fixes
        shell: bash
        run: |
          base64 --decode .github/pr23-round3/fix.py.gz.b64 \
            | gzip --decompress > /tmp/pr23-round3-fix.py
          python /tmp/pr23-round3-fix.py
          rm -rf .github/pr23-round3 .github/workflows/pr23-review-round3.yml
          git diff --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run repository gate
        run: pnpm check
      - name: Publish checked candidate commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'fix: validate final Codex runtime evidence and reroutes' \
            | git commit-tree "$tree" -p 8a386826da32a99071c6cc215ff5108d562341d7)
          git push --force origin "$commit":refs/heads/pr23-review-round3-candidate
          echo "candidate=$commit" >> "$GITHUB_STEP_SUMMARY"
