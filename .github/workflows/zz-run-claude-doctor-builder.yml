name: run Claude provenance doctor builder

on:
  push:
    branches:
      - fix/claude-doctor-provenance-activation

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claude-doctor-provenance-activation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract and run the staged implementation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/zz-build-claude-doctor.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n          git diff --check"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          code = '\n'.join(lines) + '\n'

          doctor_old = "if old_doctor not in text:\n    raise SystemExit('provider doctor block not found')\ntext = text.replace(old_doctor, new_doctor)"
          doctor_new = "doctor_start = text.index('      const checks = claudeCodeDoctorChecks(options, state)')\ndoctor_end = text.index('    } catch (error: unknown)', doctor_start)\ntext = text[:doctor_start] + new_doctor + '\\n' + text[doctor_end:]"
          if doctor_old not in code:
              raise SystemExit('staged provider doctor patch block not found')
          code = code.replace(doctor_old, doctor_new)

          status_old = "if old_status not in text:\n    raise SystemExit('provider apply status block not found')\ntext = text.replace(old_status, new_status)"
          status_new = "status_start = text.index('    const doctor = await this.doctor(context, options)')\nstatus_end = text.index('      appliedActions: applied,', status_start)\ntext = text[:status_start] + new_status + '\\n' + text[status_end:]"
          if status_old not in code:
              raise SystemExit('staged provider status patch block not found')
          code = code.replace(status_old, status_new)

          script = Path('/tmp/build-claude-doctor.py')
          script.write_text(code)
          subprocess.run(['python', str(script)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Validate implementation
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:host-contracts
      - name: Commit validated implementation
        shell: bash
        run: |
          rm .github/workflows/zz-build-claude-doctor.yml
          rm .github/workflows/zz-run-claude-doctor-builder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(claude): separate plugin integrity provenance and activation'
          git push origin HEAD:fix/claude-doctor-provenance-activation
