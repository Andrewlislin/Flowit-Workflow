<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Flowit Workflow</title>
  <desc id="desc">Agent-agnostic durable orchestration for long-lived AI sessions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101c35"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".36"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="190" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="180" cy="380" r="160" fill="#0ea5e9" opacity=".08" filter="url(#soft)"/>

  <g opacity=".16" stroke="#94a3b8">
    <path d="M0 70H1280M0 140H1280M0 210H1280M0 280H1280M0 350H1280"/>
    <path d="M80 0V420M160 0V420M240 0V420M320 0V420M400 0V420M480 0V420M560 0V420M640 0V420M720 0V420M800 0V420M880 0V420M960 0V420M1040 0V420M1120 0V420M1200 0V420"/>
  </g>

  <g transform="translate(90 95)" filter="url(#shadow)">
    <rect width="230" height="230" rx="54" fill="#0b1224" stroke="#334155" stroke-width="2"/>
    <path d="M52 62H122C145 62 164 81 164 104V114" fill="none" stroke="url(#flow)" stroke-width="14" stroke-linecap="round"/>
    <path d="M178 168H108C85 168 66 149 66 126V116" fill="none" stroke="url(#flow)" stroke-width="14" stroke-linecap="round"/>
    <path d="M148 98L164 114L180 98M82 132L66 116L50 132" fill="none" stroke="#e0e7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="62" r="15" fill="#38bdf8"/>
    <circle cx="178" cy="168" r="15" fill="#c084fc"/>
    <circle cx="164" cy="114" r="10" fill="#818cf8"/>
    <circle cx="66" cy="116" r="10" fill="#818cf8"/>
  </g>

  <g transform="translate(375 105)">
    <text x="0" y="72" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">Flowit Workflow</text>
    <text x="2" y="124" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="500">Durable orchestration for long-lived AI agent sessions</text>
    <g transform="translate(2 164)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650">
      <rect width="172" height="42" rx="21" fill="#082f49" stroke="#0ea5e9"/>
      <text x="86" y="27" text-anchor="middle" fill="#bae6fd">Schedule Engine</text>
      <rect x="186" width="156" height="42" rx="21" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="264" y="27" text-anchor="middle" fill="#c7d2fe">Work Graphs</text>
      <rect x="356" width="138" height="42" rx="21" fill="#3b0764" stroke="#a855f7"/>
      <text x="425" y="27" text-anchor="middle" fill="#e9d5ff">Skill Binding</text>
      <rect x="508" width="152" height="42" rx="21" fill="#172554" stroke="#3b82f6"/>
      <text x="584" y="27" text-anchor="middle" fill="#bfdbfe">Context Graph</text>
    </g>
  </g>

  <text x="1190" y="390" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Apache-2.0 · TypeScript · Node.js</text>
</svg>
