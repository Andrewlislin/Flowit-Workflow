<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Flowit Workflow architecture</title>
  <desc id="desc">Schedules and events enter the orchestration core, which coordinates work graphs, skills and context through host adapters.</desc>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="650" rx="24" fill="#f8fafc"/>
  <text x="640" y="54" text-anchor="middle" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="750">Host-neutral orchestration, host-authoritative execution</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <rect x="88" y="105" width="230" height="76" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="203" y="136" text-anchor="middle" fill="#075985" font-size="18" font-weight="700">Schedules</text>
    <text x="203" y="160" text-anchor="middle" fill="#0369a1" font-size="14">at · interval · recovery</text>

    <rect x="962" y="105" width="230" height="76" rx="18" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="1077" y="136" text-anchor="middle" fill="#6b21a8" font-size="18" font-weight="700">Host events</text>
    <text x="1077" y="160" text-anchor="middle" fill="#7e22ce" font-size="14">durable admission · replay</text>

    <rect x="350" y="90" width="580" height="330" rx="30" fill="url(#core)" stroke="#6366f1" stroke-width="2"/>
    <text x="640" y="135" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="760">Flowit Orchestration Core</text>

    <rect x="390" y="170" width="220" height="92" rx="18" fill="#0c4a6e" stroke="#38bdf8"/>
    <text x="500" y="205" text-anchor="middle" fill="#e0f2fe" font-size="18" font-weight="700">Durable Scheduler</text>
    <text x="500" y="230" text-anchor="middle" fill="#bae6fd" font-size="13">claim · lease · heartbeat</text>

    <rect x="670" y="170" width="220" height="92" rx="18" fill="#312e81" stroke="#818cf8"/>
    <text x="780" y="205" text-anchor="middle" fill="#eef2ff" font-size="18" font-weight="700">Pipeline / DAG</text>
    <text x="780" y="230" text-anchor="middle" fill="#c7d2fe" font-size="13">retry · checkpoint · dedupe</text>

    <rect x="390" y="290" width="220" height="92" rx="18" fill="#3b0764" stroke="#c084fc"/>
    <text x="500" y="325" text-anchor="middle" fill="#faf5ff" font-size="18" font-weight="700">Skill Binding</text>
    <text x="500" y="350" text-anchor="middle" fill="#e9d5ff" font-size="13">resolve at execution time</text>

    <rect x="670" y="290" width="220" height="92" rx="18" fill="#172554" stroke="#60a5fa"/>
    <text x="780" y="325" text-anchor="middle" fill="#eff6ff" font-size="18" font-weight="700">Context Graph</text>
    <text x="780" y="350" text-anchor="middle" fill="#bfdbfe" font-size="13">bounded · read-only · typed</text>

    <rect x="350" y="455" width="580" height="66" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="640" y="486" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="750">AgentAdapter contract</text>
    <text x="640" y="507" text-anchor="middle" fill="#475569" font-size="13">sessions · dispatch · skills · context · events · lifecycle</text>

    <g font-size="14" font-weight="700">
      <rect x="70" y="565" width="160" height="50" rx="15" fill="#ffffff" stroke="#94a3b8"/>
      <text x="150" y="596" text-anchor="middle" fill="#334155">DeepSeek Harness</text>

      <rect x="250" y="565" width="150" height="50" rx="15" fill="#ffffff" stroke="#94a3b8"/>
      <text x="325" y="596" text-anchor="middle" fill="#334155">Claude Code</text>

      <rect x="420" y="565" width="130" height="50" rx="15" fill="#ffffff" stroke="#94a3b8"/>
      <text x="485" y="596" text-anchor="middle" fill="#334155">OpenCode</text>

      <rect x="570" y="565" width="130" height="50" rx="15" fill="#ffffff" stroke="#94a3b8"/>
      <text x="635" y="596" text-anchor="middle" fill="#334155">Codex</text>

      <rect x="720" y="565" width="150" height="50" rx="15" fill="#ffffff" stroke="#94a3b8"/>
      <text x="795" y="596" text-anchor="middle" fill="#334155">WorkBuddy</text>

      <rect x="890" y="565" width="150" height="50" rx="15" fill="#ffffff" stroke="#94a3b8"/>
      <text x="965" y="596" text-anchor="middle" fill="#334155">豆包办公</text>

      <rect x="1060" y="565" width="150" height="50" rx="15" fill="#ffffff" stroke="#94a3b8"/>
      <text x="1135" y="596" text-anchor="middle" fill="#334155">Future hosts</text>
    </g>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M318 143H350"/>
    <path d="M962 143H930"/>
    <path d="M640 420V455"/>
    <path d="M640 521V548"/>
  </g>
  <path d="M150 548H1135" fill="none" stroke="url(#edge)" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#64748b" stroke-width="2">
    <path d="M150 548V565M325 548V565M485 548V565M635 548V565M795 548V565M965 548V565M1135 548V565"/>
  </g>
</svg>
